<text x="550.0" y="1299" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#155e75">8 · Feedback — thumbs up / thumbs down</text>
<text x="550.0" y="1323" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#334155">reason codes → evaluation set (Day 5)</text>
