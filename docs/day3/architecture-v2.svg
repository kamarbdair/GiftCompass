<rect width="1100" height="1420" fill="#ffffff"/>
<rect x="300" y="30" width="500" height="90" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2.2"/>
<text x="550.0" y="57" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#1e3a8a">1 · Frontend — Gift Context (sender)</text>
<text x="550.0" y="81" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#334155">relationship · occasion · budget in SAR</text>
<text x="550.0" y="102" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#334155">days until occasion · delivery city</text>
<rect x="20" y="150" width="232" height="170" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2.2"/>
<text x="136.0" y="177" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#065f46">Receiver — Gift Profile link</text>
<text x="136.0" y="201" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#334155">quick questions, or</text>
<text x="136.0" y="222" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#334155">TikTok export read in the</text>
<text x="136.0" y="243" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#334155">browser (never uploaded raw)</text>
<text x="136.0" y="264" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#334155">preview → remove → approve</text>
<rect x="300" y="170" width="500" height="110" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2.2"/>
<text x="550.0" y="197" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#065f46">2 · Consent + Signal Collector</text>
<text x="550.0" y="221" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#334155">primary: sender quiz + manual input</text>
<text x="550.0" y="242" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#334155">optional, receiver-consented: TikTok export,</text>
<text x="550.0" y="263" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#334155">Pinterest, Spotify</text>
<rect x="300" y="320" width="500" height="74" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2.2"/>
<text x="550.0" y="347" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#334155">Normalized Signal  {text, source, date, type}</text>
<text x="550.0" y="371" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#334155">strength: posted 1.0 &gt; reposted .9 &gt; saved .8 &gt; liked .6 &gt; watched .3</text>
<rect x="300" y="434" width="500" height="116" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.2"/>
<text x="550.0" y="461" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#5b21b6">3 · Persona Builder — LLM, JSON output</text>
<text x="550.0" y="485" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#334155">interests + weight + evidence · dislikes · style</text>
<text x="550.0" y="506" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#334155">sentiment check · giftability score</text>
<text x="550.0" y="527" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#334155">blocked: religion, health, politics, sexuality</text>
<rect x="20" y="590" width="232" height="148" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2.2" stroke-dasharray="7 5"/>
<text x="136.0" y="617" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#065f46">PDPL guardrail</text>
<text x="136.0" y="641" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#334155">raw export deleted once the</text>
<text x="136.0" y="662" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#334155">persona is built · only the</text>
<text x="136.0" y="683" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#334155">persona is stored · receiver</text>
<text x="136.0" y="704" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#334155">can revoke at any time</text>
<rect x="300" y="590" width="500" height="74" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.2"/>
<text x="550.0" y="617" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#5b21b6">Persona JSON  (persona.schema.json)</text>
<text x="550.0" y="641" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#334155">auditable: every interest carries its evidence</text>
<rect x="820" y="700" width="250" height="118" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2.2"/>
<text x="945.0" y="727" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#334155">Product Catalog</text>
<text x="945.0" y="751" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#334155">product.schema.json</text>
<text x="945.0" y="772" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#334155">products_demo.csv</text>
<text x="945.0" y="793" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#334155">187 demo items, SAR</text>
<text x="945.0" y="814" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#334155">+ text embeddings</text>
<rect x="300" y="704" width="500" height="90" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2.2"/>
<text x="550.0" y="731" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#92400e">4 · Candidate Retrieval</text>
<text x="550.0" y="755" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#334155">multilingual embeddings (AR + EN) · cosine top 50</text>
<rect x="300" y="834" width="500" height="116" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2.2"/>
<text x="550.0" y="861" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#92400e">5 · Hard Filters — before ranking</text>
<text x="550.0" y="885" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#334155">price ≤ budget · delivery ≤ days left · age range</text>
<text x="550.0" y="906" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#334155">relationship fit · not in dislikes · not already owned</text>
<text x="550.0" y="927" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#334155">embarrassment risk ≤ threshold for this relationship</text>
<rect x="300" y="990" width="500" height="116" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2.2"/>
<text x="550.0" y="1017" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#92400e">6 · Ranking</text>
<text x="550.0" y="1041" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#334155">0.40 interest match + 0.20 giftability + 0.15 budget fit</text>
<text x="550.0" y="1062" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#334155">+ 0.10 novelty − 0.15 embarrassment risk</text>
<text x="550.0" y="1083" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#334155">optional LLM list-wise re-rank of the top 10</text>
<rect x="300" y="1146" width="500" height="86" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="2.2"/>
<text x="550.0" y="1173" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#155e75">7 · Results — up to 5 gifts</text>
<text x="550.0" y="1197" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#334155">image · name · price in SAR · seller · why this matches</text>
